name: ci

on:
  push:
  pull_request:
  schedule:
    # Nightly, to catch upstream API drift rather than waiting for a user to hit it.
    - cron: "0 3 * * *"

jobs:
  gates:
    name: lint, types, contract tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy src/
      - name: contract tests (offline, no network)
        run: pytest tests/contract -q
      - name: eval harness (offline, deterministic)
        run: python eval/run_eval.py

  drift:
    name: upstream contract (live)
    # Only on the nightly schedule: these call codeforces.com, so they must not gate
    # a pull request on someone else's uptime.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: live drift tests
        run: pytest -m live -q
